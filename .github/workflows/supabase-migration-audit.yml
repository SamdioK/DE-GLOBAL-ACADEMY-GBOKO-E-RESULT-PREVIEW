name: Supabase migration history audit (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-history:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_URL" || { echo "Missing SUPABASE_DB_URL (use the Supabase IPv4-compatible Session pooler connection string)"; exit 1; }

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: List local and remote migration history (read-only via IPv4 pooler)
        shell: bash
        run: |
          echo "This command only lists migration history; it does not apply migrations."
          supabase migration list --db-url "$SUPABASE_DB_URL"
