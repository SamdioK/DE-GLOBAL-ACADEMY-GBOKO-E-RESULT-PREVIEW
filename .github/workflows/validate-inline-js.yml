name: Validate E-Result JavaScript

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and syntax-check inline scripts
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.external = False
                  self.parts = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.active = True
                      self.external = any(k.lower() == "src" for k, v in attrs)
                      self.parts = []
              def handle_data(self, data):
                  if self.active and not self.external:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.active:
                      if not self.external:
                          self.scripts.append("".join(self.parts))
                      self.active = False
          parser = Scripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          if not parser.scripts:
              raise SystemExit("No inline scripts found")
          for i, script in enumerate(parser.scripts, 1):
              path = Path(f"/tmp/inline-{i}.js")
              path.write_text(script, encoding="utf-8")
              print(f"Checking inline script {i}: {len(script.splitlines())} lines")
              import subprocess
              result = subprocess.run(["node", "--check", str(path)], text=True, capture_output=True)
              if result.returncode:
                  print(result.stdout)
                  print(result.stderr)
                  raise SystemExit(result.returncode)
          print(f"All {len(parser.scripts)} inline script(s) passed syntax validation.")
          PY
