name: Supabase deployment (manual)

on:
  workflow_dispatch:
    inputs:
      deploy_database:
        description: "Apply pending SQL migrations to the production database"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"
      deploy_edge_functions:
        description: "Deploy Edge Functions found in supabase/functions"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "yes"
      download_existing_functions:
        description: "Download existing deployed Edge Function source as a private audit artifact"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

jobs:
  connection-check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      EXPECTED_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$EXPECTED_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase authentication and project access (read-only)
        shell: bash
        run: |
          projects="$(supabase projects list)"
          printf '%s\n' "$projects"
          if ! printf '%s\n' "$projects" | grep -Fq "$EXPECTED_PROJECT_REF"; then
            echo "Expected project was not listed. Check token permissions and project access."
            exit 1
          fi
          echo "Supabase authentication succeeded and the expected project is visible."


  download-functions:
    if: ${{ inputs.download_existing_functions == 'yes' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: List deployed Edge Functions
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"

      - name: Download deployed Edge Function source
        run: supabase functions download --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Upload private source archive for review
        uses: actions/upload-artifact@v4
        with:
          name: deployed-edge-functions-source
          path: supabase/functions/
          if-no-files-found: error
          retention-days: 3

  database:
    if: ${{ inputs.deploy_database == 'yes' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview pending migrations
        run: supabase db push --dry-run --linked

      - name: Apply pending migrations
        run: supabase db push --linked

  edge-functions:
    if: ${{ inputs.deploy_edge_functions == 'yes' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy available Edge Functions
        shell: bash
        run: |
          if [ ! -d "supabase/functions" ]; then
            echo "No supabase/functions directory exists in this repository; nothing to deploy."
            exit 0
          fi
          mapfile -t functions < <(find supabase/functions -mindepth 2 -maxdepth 2 -name 'index.ts' -printf '%h\n' | sort)
          if [ "${#functions[@]}" -eq 0 ]; then
            echo "No Edge Function index.ts files found; nothing to deploy."
            exit 0
          fi
          for function_dir in "${functions[@]}"; do
            function_name="$(basename "$function_dir")"
            echo "Deploying $function_name"
            supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_REF" --use-api
          done
